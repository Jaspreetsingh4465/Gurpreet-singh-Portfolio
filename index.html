<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e0c0a" />

    <title>Gurpreet Singh, Artist and Educator in Bathinda, Punjab</title>
    <meta
      name="description"
      content="Gurpreet Artist Bathinda: three decades of oil painting, portraiture, photography and research into Sikh art and Punjab’s living history. Exhibitions, artwork and commissions."
    />
    <link rel="canonical" href="https://gurpreetartist.com/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gurpreet Singh, Artist" />
    <meta property="og:title" content="Gurpreet Singh, Stories preserved in colour" />
    <meta
      property="og:description"
      content="Painting the people, places and stories of Punjab. Portraiture, historical painting, photography and art education."
    />
    <meta property="og:image" content="https://gurpreetartist.com/gallery/opt/hero-1600.webp" />
    <meta property="og:url" content="https://gurpreetartist.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gurpreet Singh, Stories preserved in colour" />
    <meta
      name="twitter:description"
      content="Painting the people, places and stories of Punjab."
    />
    <meta name="twitter:image" content="https://gurpreetartist.com/gallery/opt/hero-1600.webp" />

    <!-- Start the LCP image download before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      media="(min-width: 768px)"
      href="/gallery/opt/hero-1600.webp"
      imagesrcset="/gallery/opt/hero-700.webp 700w, /gallery/opt/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(max-width: 767px)"
      href="/gallery/opt/hero-tall-720.webp"
      imagesrcset="/gallery/opt/hero-tall-450.webp 450w, /gallery/opt/hero-tall-720.webp 720w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Tells Google this is a person, not a company. Update sameAs with the
         real social profiles once they're live. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gurpreet Singh",
        "alternateName": "Gurpreet Artist Bathinda",
        "jobTitle": "Artist, Educator and Researcher",
        "description": "Painter, photographer and art educator working in oil, watercolour and acrylic, with a focus on Punjab's history, portraiture and folk culture.",
        "url": "https://gurpreetartist.com/",
        "image": "https://gurpreetartist.com/gallery/opt/hero-1600.webp",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bathinda",
          "addressRegion": "Punjab",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "Oil painting",
          "Portraiture",
          "Sikh art and iconography",
          "Punjab folk culture",
          "Documentary photography",
          "Art education"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Gurpreet Singh, artist, educator and researcher based in Bathinda, Punjab. This portfolio
      needs JavaScript enabled to display.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
